<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0912">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<title>NEO-SUSU — Mon profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
<style>
.p-head { text-align: center; padding: 28px 20px; margin-bottom: 8px; }
.p-avatar { width: 88px; height: 88px; font-size: 42px; margin: 0 auto 14px; position: relative; z-index: 1; box-shadow: 0 16px 40px rgba(212,175,55,.35); }
.p-name { font-family: var(--ff-s); font-size: 28px; font-weight: 700; position: relative; z-index: 1; }
.p-email { color: var(--text2); font-size: 13px; position: relative; z-index: 1; }
.panel { display: none; margin: -2px 0 10px; }
.panel.open { display: block; }
.legal { text-align: center; font-size: 11px; color: var(--text3); margin-top: 26px; line-height: 1.7; }
</style>
</head>
<body>
<div class="container">
  <a href="./dashboard.html" class="back-link" data-fr="← Retour" data-en="← Back">← Retour</a>

  <div class="hero-card p-head">
    <div class="avatar gold p-avatar" id="pAvatar">?</div>
    <div class="p-name" id="pName">…</div>
    <div class="p-email" id="pEmail"></div>
    <div style="margin-top:10px;position:relative;z-index:1"><span class="chip" id="pKyc"></span> <span class="chip" id="pPlan"></span></div>
  </div>

  <div class="section-title"><span data-fr="Compte" data-en="Account">Compte</span></div>
  <button class="menu-item" data-panel="infoPanel" type="button"><span class="menu-icon">👤</span><div class="menu-text"><div class="menu-label" data-fr="Informations personnelles" data-en="Personal information">Informations personnelles</div><div class="menu-detail" data-fr="Nom, téléphone, pays" data-en="Name, phone, country">Nom, téléphone, pays</div></div><span class="menu-arrow">›</span></button>
  <div class="panel card" id="infoPanel">
    <form id="infoForm" novalidate>
      <div class="row">
        <div class="form-group"><label for="fFirst" data-fr="Prénom" data-en="First name">Prénom</label><input id="fFirst" maxlength="50" required></div>
        <div class="form-group"><label for="fLast" data-fr="Nom" data-en="Last name">Nom</label><input id="fLast" maxlength="50" required></div>
      </div>
      <div class="form-group"><label for="fPhone" data-fr="Téléphone" data-en="Phone">Téléphone</label><input id="fPhone" type="tel" maxlength="25"></div>
      <div class="form-group"><label for="fCountry" data-fr="Pays (code)" data-en="Country (code)">Pays (code)</label><input id="fCountry" maxlength="5" placeholder="FR, SN, NG…"></div>
      <div class="msg" id="infoMsg"></div>
      <button class="btn btn-primary" type="submit" id="infoBtn" data-fr="Enregistrer" data-en="Save">Enregistrer</button>
    </form>
  </div>
  <a class="menu-item" href="./kyc.html"><span class="menu-icon">🔐</span><div class="menu-text"><div class="menu-label" data-fr="Vérification d'identité (KYC)" data-en="Identity verification (KYC)">Vérification d'identité (KYC)</div><div class="menu-detail" id="kycDetail"></div></div><span class="menu-arrow">›</span></a>
  <div class="menu-item" style="cursor:default"><span class="menu-icon">💳</span><div class="menu-text"><div class="menu-label" data-fr="Moyens de paiement" data-en="Payment methods">Moyens de paiement</div><div class="menu-detail" data-fr="Mobile Money, carte bancaire" data-en="Mobile Money, bank card">Mobile Money, carte bancaire</div></div><span class="chip chip-grey" data-fr="Bientôt" data-en="Soon">Bientôt</span></div>

  <div class="section-title"><span data-fr="Sécurité" data-en="Security">Sécurité</span></div>
  <button class="menu-item" data-panel="pwPanel" type="button"><span class="menu-icon">🔒</span><div class="menu-text"><div class="menu-label" data-fr="Mot de passe" data-en="Password">Mot de passe</div><div class="menu-detail" data-fr="Modifier mon mot de passe" data-en="Change my password">Modifier mon mot de passe</div></div><span class="menu-arrow">›</span></button>
  <div class="panel card" id="pwPanel">
    <form id="pwForm" novalidate>
      <div class="form-group"><label for="pw1" data-fr="Nouveau mot de passe" data-en="New password">Nouveau mot de passe</label><input id="pw1" type="password" minlength="8" autocomplete="new-password"></div>
      <div class="form-group"><label for="pw2" data-fr="Confirmer" data-en="Confirm">Confirmer</label><input id="pw2" type="password" minlength="8" autocomplete="new-password"></div>
      <div class="msg" id="pwMsg"></div>
      <button class="btn btn-primary" type="submit" id="pwBtn" data-fr="Mettre à jour" data-en="Update">Mettre à jour</button>
    </form>
  </div>

  <div class="section-title"><span data-fr="Préférences" data-en="Preferences">Préférences</span></div>
  <button class="menu-item" id="langItem" type="button"><span class="menu-icon">🌍</span><div class="menu-text"><div class="menu-label" data-fr="Langue" data-en="Language">Langue</div><div class="menu-detail" data-fr="Français — toucher pour passer en anglais" data-en="English — tap to switch to French">Français — toucher pour passer en anglais</div></div><span class="menu-arrow">›</span></button>

  <div class="section-title"><span data-fr="Aide" data-en="Help">Aide</span></div>
  <a class="menu-item" href="mailto:contact@neo-susu.com"><span class="menu-icon">💬</span><div class="menu-text"><div class="menu-label" data-fr="Aide et contact" data-en="Help and contact">Aide et contact</div><div class="menu-detail">contact@neo-susu.com</div></div><span class="menu-arrow">›</span></a>

  <button class="logout-btn" id="logoutBtn" type="button" data-fr="Se déconnecter" data-en="Sign out">Se déconnecter</button>
  <div class="legal">NEO-SUSU · SIREN <span id="siren"></span></div>
</div>
<script>
NS.boot({ demoBanner: true });
const t = NS.t;
const demo = NS.isDemo();
let p = null;
document.getElementById("siren").textContent = NS.CFG.COMPANY.siren;

function render() {
  if (!p) return;
  document.getElementById("pAvatar").textContent = (p.first_name || p.email || "?")[0].toUpperCase();
  document.getElementById("pName").textContent = (p.first_name + " " + p.last_name).trim();
  document.getElementById("pEmail").textContent = p.email || "";
  const k = document.getElementById("pKyc"), ki = NS.kycInfo(p.kyc_status);
  k.className = "chip " + ki.cls; k.textContent = ki.text.replace(" →", "");
  document.getElementById("kycDetail").textContent = ki.text.replace(/^[^A-Za-zÀ-ÿ]+/, "");
  const pl = document.getElementById("pPlan");
  pl.className = "chip chip-violet"; pl.textContent = "Plan " + (NS.PLANS[p.plan] || NS.PLANS.free).name;
  document.getElementById("fFirst").value = p.first_name || "";
  document.getElementById("fLast").value = p.last_name || "";
  document.getElementById("fPhone").value = p.phone || "";
  document.getElementById("fCountry").value = p.country || "";
}
document.addEventListener("langchange", render);

document.querySelectorAll("[data-panel]").forEach(b => b.addEventListener("click", () => document.getElementById(b.dataset.panel).classList.toggle("open")));
document.getElementById("langItem").addEventListener("click", () => NS.setLang(NS.lang === "fr" ? "en" : "fr"));
document.getElementById("logoutBtn").addEventListener("click", () => { if (confirm(t("Voulez-vous vraiment vous déconnecter ?", "Are you sure you want to sign out?"))) NS.signOut(); });

document.getElementById("infoForm").addEventListener("submit", async e => {
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim();
  const fields = { first_name: v("fFirst"), last_name: v("fLast"), phone: v("fPhone") || null, country: v("fCountry").toUpperCase() || null };
  if (!fields.first_name || !fields.last_name) return NS.showMsg("infoMsg", t("Prénom et nom obligatoires", "First and last name are required"));
  if (demo) return NS.showMsg("infoMsg", t("Démo : rien n'est enregistré", "Demo: nothing is saved"), true);
  const btn = document.getElementById("infoBtn");
  NS.setLoading(btn, true, "…");
  try { await NS.updateProfile(fields); Object.assign(p, fields); render(); NS.showMsg("infoMsg", t("Enregistré ✓", "Saved ✓"), true); }
  catch (err) { NS.showMsg("infoMsg", NS.errText(err)); }
  NS.setLoading(btn, false);
});

document.getElementById("pwForm").addEventListener("submit", async e => {
  e.preventDefault();
  const a = document.getElementById("pw1").value, b = document.getElementById("pw2").value;
  if (a.length < 8) return NS.showMsg("pwMsg", t("8 caractères minimum", "8 characters minimum"));
  if (a !== b) return NS.showMsg("pwMsg", t("Les deux mots de passe ne correspondent pas", "Passwords do not match"));
  if (demo) return NS.showMsg("pwMsg", t("Démo : rien n'est enregistré", "Demo: nothing is saved"), true);
  const btn = document.getElementById("pwBtn");
  NS.setLoading(btn, true, "…");
  try { await NS.updatePassword(a); e.target.reset(); NS.showMsg("pwMsg", t("Mot de passe mis à jour ✓", "Password updated ✓"), true); }
  catch (err) { NS.showMsg("pwMsg", NS.errText(err)); }
  NS.setLoading(btn, false);
});

(async () => {
  if (demo) { p = Object.assign({}, NS.DEMO.profile); return render(); }
  try { p = await NS.getProfile(); render(); }
  catch (err) { if (err.message !== "redirect") NS.toast(NS.errText(err), "err"); }
})();
</script>
</body>
</html>
