<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0912">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/favicon.png">
<title>NEO-SUSU — Créer une tontine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</head>
<body>
<div class="container">
  <a href="./dashboard.html" class="back-link" data-fr="← Retour au tableau de bord" data-en="← Back to dashboard">← Retour au tableau de bord</a>
  <h1 class="page-title" data-fr="Créer une tontine" data-en="Create a tontine">Créer une tontine</h1>
  <p class="page-subtitle" data-fr="Tu deviens l'organisateur·rice et tu reçois le pot au tour n°1." data-en="You become the organiser and receive the pot in round 1.">Tu deviens l'organisateur·rice et tu reçois le pot au tour n°1.</p>

  <div class="info-box" id="demoInfo" style="display:none"><strong data-fr="Mode démo" data-en="Demo mode">Mode démo</strong> — <span data-fr="cette tontine ne sera pas enregistrée." data-en="this tontine will not be saved.">cette tontine ne sera pas enregistrée.</span></div>
  <div class="msg" id="msg" role="alert"></div>

  <form id="tontineForm" novalidate>
    <div class="form-group">
      <label for="name" data-fr="Nom de la tontine" data-en="Tontine name">Nom de la tontine</label>
      <input type="text" id="name" data-ph-fr="Ex : Tontine Famille Diallo" data-ph-en="E.g. Diallo Family Tontine" placeholder="Ex : Tontine Famille Diallo" required maxlength="80">
    </div>
    <div class="form-group">
      <label for="description" data-fr="Description (facultatif)" data-en="Description (optional)">Description (facultatif)</label>
      <textarea id="description" maxlength="500" data-ph-fr="Objectif, règles du groupe…" data-ph-en="Goal, group rules…" placeholder="Objectif, règles du groupe…"></textarea>
    </div>
    <div class="row">
      <div class="form-group">
        <label for="amount" data-fr="Cotisation / membre" data-en="Contribution / member">Cotisation / membre</label>
        <input type="number" id="amount" placeholder="25000" min="1" step="any" inputmode="decimal" required>
      </div>
      <div class="form-group">
        <label for="currency" data-fr="Devise" data-en="Currency">Devise</label>
        <select id="currency">
          <option value="XOF">FCFA (XOF)</option>
          <option value="XAF">FCFA (XAF)</option>
          <option value="EUR">Euro (EUR)</option>
          <option value="GBP">Pound (GBP)</option>
          <option value="NGN">Naira (NGN)</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <label for="frequency" data-fr="Fréquence" data-en="Frequency">Fréquence</label>
        <select id="frequency">
          <option value="weekly" data-fr="Hebdomadaire" data-en="Weekly">Hebdomadaire</option>
          <option value="biweekly" data-fr="Bimensuelle" data-en="Biweekly">Bimensuelle</option>
          <option value="monthly" selected data-fr="Mensuelle" data-en="Monthly">Mensuelle</option>
        </select>
      </div>
      <div class="form-group">
        <label for="maxMembers" data-fr="Nombre de membres" data-en="Number of members">Nombre de membres</label>
        <input type="number" id="maxMembers" min="2" max="50" value="6" required inputmode="numeric">
        <div class="hint" id="maxHint"></div>
      </div>
    </div>
    <div class="form-group">
      <label for="startDate" data-fr="Date du premier tour" data-en="First round date">Date du premier tour</label>
      <input type="date" id="startDate" required>
    </div>

    <div class="fee-box" id="preview" style="display:none">
      <div class="fee-title" data-fr="Aperçu" data-en="Preview">Aperçu</div>
      <div class="fee-row"><span data-fr="Cotisation par membre" data-en="Contribution per member">Cotisation par membre</span><span class="fee-val" id="pvAmt"></span></div>
      <div class="fee-row"><span id="pvFeeLabel"></span><span class="fee-val" id="pvFee" style="color:var(--violet-pale)"></span></div>
      <div class="fee-row"><span data-fr="Pot reçu à chaque tour" data-en="Pot received each round">Pot reçu à chaque tour</span><span class="fee-val" id="pvPot" style="color:var(--em-pale)"></span></div>
    </div>

    <button type="submit" class="btn btn-primary btn-submit" id="submitBtn" data-fr="Créer la tontine ✦" data-en="Create tontine ✦">Créer la tontine ✦</button>
  </form>
</div>
<script>
NS.boot({ demoBanner: true });
const t = NS.t;
const demo = NS.isDemo();
let plan = "free";
document.getElementById("startDate").value = new Date().toISOString().slice(0, 10);
if (demo) document.getElementById("demoInfo").style.display = "block";

function maxForPlan() { return (NS.PLANS[plan] || NS.PLANS.free).maxMembers; }
function updatePreview() {
  const amt = parseFloat(document.getElementById("amount").value) || 0;
  const cur = document.getElementById("currency").value;
  const n = parseInt(document.getElementById("maxMembers").value) || 0;
  document.getElementById("maxHint").textContent = t("Max. " + maxForPlan() + " avec ton plan", "Max " + maxForPlan() + " on your plan");
  const box = document.getElementById("preview");
  if (amt <= 0) { box.style.display = "none"; return; }
  box.style.display = "block";
  const rate = NS.PLANS[plan].fee;
  document.getElementById("pvAmt").textContent = NS.money(amt, cur);
  document.getElementById("pvFeeLabel").textContent = t("Commission NEO-SUSU payée par chaque membre (" + String(rate).replace(".", ",") + " % selon son plan)", "NEO-SUSU fee paid by each member (" + rate + "% depending on their plan)");
  document.getElementById("pvFee").textContent = "+ " + NS.money(NS.fee(amt, plan), cur);
  document.getElementById("pvPot").textContent = n >= 2 ? NS.money(amt * n, cur) : "—";
}
["amount", "currency", "maxMembers"].forEach(id => document.getElementById(id).addEventListener("input", updatePreview));
document.addEventListener("langchange", updatePreview);

(async () => {
  if (demo) return updatePreview();
  try { plan = (await NS.getProfile()).plan || "free"; } catch (e) { if (e.message === "redirect") return; }
  updatePreview();
})();

document.getElementById("tontineForm").addEventListener("submit", async e => {
  e.preventDefault();
  NS.hideMsg("msg");
  const v = id => document.getElementById(id).value.trim();
  const amount = parseFloat(v("amount")), max = parseInt(v("maxMembers"));
  if (v("name").length < 2) return NS.showMsg("msg", t("Donne un nom à ta tontine (2 caractères min.)", "Give your tontine a name (2 characters min.)"));
  if (!(amount > 0)) return NS.showMsg("msg", t("Indique un montant de cotisation", "Enter a contribution amount"));
  if (!(max >= 2 && max <= maxForPlan())) return NS.showMsg("msg", t("Nombre de membres : entre 2 et " + maxForPlan() + " avec ton plan", "Members: between 2 and " + maxForPlan() + " on your plan"));
  if (!v("startDate")) return NS.showMsg("msg", t("Choisis une date de début", "Choose a start date"));

  const btn = document.getElementById("submitBtn");
  NS.setLoading(btn, true, t("Création…", "Creating…"));
  if (demo) {
    NS.showMsg("msg", t("Tontine créée (démo) ! Redirection…", "Tontine created (demo)! Redirecting…"), true);
    return setTimeout(() => location.href = "./tontine-detail.html?id=demo-3", 1200);
  }
  try {
    const id = await NS.rpc("create_tontine", {
      p_name: v("name"), p_description: v("description") || null, p_amount: amount,
      p_currency: v("currency"), p_frequency: v("frequency"), p_max_members: max, p_start_date: v("startDate")
    });
    location.href = "./tontine-detail.html?id=" + encodeURIComponent(id) + "&new=1";
  } catch (err) {
    NS.showMsg("msg", NS.errText(err));
    NS.setLoading(btn, false);
  }
});
</script>
</body>
</html>
