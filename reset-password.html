<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0912">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<title>NEO-SUSU — Nouveau mot de passe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</head>
<body>
<div class="container" style="max-width:420px">
  <div class="logo-section">
    <div class="logo-icon">N</div>
    <h1 class="page-title" data-fr="Nouveau mot de passe" data-en="New password">Nouveau mot de passe</h1>
    <p class="page-subtitle" data-fr="Choisis un mot de passe d'au moins 8 caractères" data-en="Choose a password of at least 8 characters">Choisis un mot de passe d'au moins 8 caractères</p>
  </div>
  <div class="msg" id="msg" role="alert"></div>
  <form id="resetForm" novalidate>
    <div class="form-group"><label for="pw1" data-fr="Nouveau mot de passe" data-en="New password">Nouveau mot de passe</label><input type="password" id="pw1" minlength="8" required autocomplete="new-password"></div>
    <div class="form-group"><label for="pw2" data-fr="Confirmer" data-en="Confirm">Confirmer</label><input type="password" id="pw2" minlength="8" required autocomplete="new-password"></div>
    <button type="submit" class="btn btn-primary btn-submit" id="submitBtn" data-fr="Enregistrer ✦" data-en="Save ✦">Enregistrer ✦</button>
  </form>
</div>
<script>
NS.boot();
const t = NS.t;
document.getElementById("resetForm").addEventListener("submit", async e => {
  e.preventDefault();
  const a = document.getElementById("pw1").value, b = document.getElementById("pw2").value;
  if (a.length < 8) return NS.showMsg("msg", t("8 caractères minimum", "8 characters minimum"));
  if (a !== b) return NS.showMsg("msg", t("Les deux mots de passe ne correspondent pas", "Passwords do not match"));
  const btn = document.getElementById("submitBtn");
  NS.setLoading(btn, true, "…");
  try {
    // Le lien reçu par email ouvre une session temporaire (récupérée automatiquement par supabase-js)
    if (!(await NS.getUser())) throw new Error(t("Lien expiré ou invalide. Redemandez un lien depuis la page de connexion.", "Expired or invalid link. Request a new one from the sign-in page."));
    await NS.updatePassword(a);
    NS.showMsg("msg", t("Mot de passe mis à jour ! Redirection…", "Password updated! Redirecting…"), true);
    setTimeout(() => location.replace("./dashboard.html"), 1200);
  } catch (err) { NS.showMsg("msg", NS.errText(err)); NS.setLoading(btn, false); }
});
</script>
</body>
</html>
