<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0912">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/favicon.png">
<title>NEO-SUSU — Rejoindre une tontine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</head>
<body>
<div class="container">
  <a href="./dashboard.html" class="back-link" data-fr="← Retour" data-en="← Back">← Retour</a>
  <h1 class="page-title" data-fr="Rejoindre une tontine" data-en="Join a tontine">Rejoindre une tontine</h1>
  <p class="page-subtitle" data-fr="Saisis le code d'invitation reçu de l'organisateur·rice." data-en="Enter the invitation code you received from the organiser.">Saisis le code d'invitation reçu de l'organisateur·rice.</p>

  <div class="info-box" id="demoInfo" style="display:none"><strong data-fr="Mode démo" data-en="Demo mode">Mode démo</strong> — <span data-fr="essaie avec n'importe quel code." data-en="try any code.">essaie avec n'importe quel code.</span></div>
  <div class="msg" id="msg" role="alert"></div>

  <form id="joinForm" novalidate>
    <label for="inviteCode" style="text-align:center" data-fr="Code d'invitation" data-en="Invitation code">Code d'invitation</label>
    <input type="text" class="code-input" id="inviteCode" placeholder="XXXXXX" maxlength="6" autocomplete="off" autocapitalize="characters" required>
    <button type="submit" class="btn btn-primary btn-submit" id="submitBtn" data-fr="Rejoindre ✦" data-en="Join ✦">Rejoindre ✦</button>
  </form>

  <div class="info-box gold" style="margin-top:24px">
    💡 <span data-fr="Astuce : si on t'a envoyé un lien d'invitation, il suffit de l'ouvrir — le code se remplit tout seul." data-en="Tip: if you received an invitation link, just open it — the code fills in automatically.">Astuce : si on t'a envoyé un lien d'invitation, il suffit de l'ouvrir — le code se remplit tout seul.</span>
  </div>
</div>
<script>
NS.boot({ demoBanner: true });
const t = NS.t;
const demo = NS.isDemo();
const input = document.getElementById("inviteCode");
if (demo) document.getElementById("demoInfo").style.display = "block";

const fromUrl = new URLSearchParams(location.search).get("code");
if (fromUrl) input.value = fromUrl.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
input.addEventListener("input", () => { input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); });

// Un invité non connecté qui ouvre le lien : on garde le code et on l'envoie s'inscrire
(async () => {
  if (demo) return;
  if (!(await NS.getUser())) {
    if (fromUrl) try { sessionStorage.setItem("ns_pending_code", input.value); } catch (e) {}
    location.replace("./signup.html");
    return;
  }
  try {
    const pending = sessionStorage.getItem("ns_pending_code");
    if (pending && !input.value) input.value = pending;
    sessionStorage.removeItem("ns_pending_code");
  } catch (e) {}
})();

document.getElementById("joinForm").addEventListener("submit", async e => {
  e.preventDefault();
  NS.hideMsg("msg");
  const code = input.value.trim();
  if (code.length !== 6) return NS.showMsg("msg", t("Le code contient 6 caractères", "The code has 6 characters"));
  const btn = document.getElementById("submitBtn");
  NS.setLoading(btn, true, "…");
  if (demo) {
    NS.showMsg("msg", t("Tu as rejoint la tontine (démo) ! Redirection…", "You joined the tontine (demo)! Redirecting…"), true);
    return setTimeout(() => location.href = "./tontine-detail.html?id=demo-3", 1200);
  }
  try {
    const id = await NS.rpc("join_tontine", { p_code: code });
    location.href = "./tontine-detail.html?id=" + encodeURIComponent(id);
  } catch (err) {
    NS.showMsg("msg", NS.errText(err));
    NS.setLoading(btn, false);
  }
});
</script>
</body>
</html>
