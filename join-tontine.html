<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E0C1A">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>NEO-SUSU — Rejoindre une tontine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">
<script src="./plans.js"></script>
<style>
  .code-input{width:100%;padding:24px;background:var(--raised);border:2px solid rgba(179,147,244,.3);border-radius:16px;color:var(--gold);font-family:var(--ff-s);font-size:32px;font-weight:700;text-align:center;letter-spacing:8px;text-transform:uppercase;}
  .code-input:focus{outline:none;border-color:var(--gold);}
  .qr-section{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:24px;text-align:center;}
  .qr-icon{font-size:64px;margin-bottom:12px;}
  .guarantee-opt{text-transform:none;letter-spacing:normal;font-weight:400;color:var(--text);display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid rgba(43,173,122,.3);border-radius:16px;padding:14px 16px;margin:16px 0;cursor:pointer;text-align:left;}
  .guarantee-opt input{width:20px;height:20px;margin-top:2px;accent-color:#2BAD7A;flex-shrink:0;}
  .guarantee-opt strong{display:block;font-size:14px;margin-bottom:4px;}
  .guarantee-opt small{display:block;font-size:12px;color:var(--text2);line-height:1.5;}
  .btn-camera{display:inline-block;padding:12px 24px;background:transparent;border:1px solid var(--sky);color:var(--sky);border-radius:18px;font-family:var(--ff-b);font-size:14px;font-weight:600;cursor:pointer;}
</style>

</head>
<body>

<div class="lang-bar">
  <span class="lang-flag active" id="flag-fr" onclick="setLang('fr')" title="Francais">🇫🇷</span>
  <div class="lang-sep"></div>
  <span class="lang-flag" id="flag-en" onclick="setLang('en')" title="English">🇬🇧</span>
</div>
<div class="container">
  <a href="./dashboard.html" class="back-link" data-fr="← Retour" data-en="← Back">← Retour</a>
  <h1 class="page-title" data-fr="Rejoindre une tontine" data-en="Join a tontine">Rejoindre une tontine</h1>
  <p class="page-subtitle" data-fr="Saisis le code d’invitation recu" data-en="Enter the invitation code you received">Saisis le code d’invitation recu</p>
  <div class="info-box">
    💡 <strong data-fr="Mode demo" data-en="Demo mode">Mode demo</strong> —
    <span data-fr="Essaie avec un code fictif." data-en="Try with a fictional code.">Essaie avec un code fictif.</span>
  </div>
  <form id="joinForm">
    <label style="text-align:center;display:block;" data-fr="Code d’invitation" data-en="Invitation code">Code d’invitation</label>
    <input type="text" class="code-input" id="inviteCode" placeholder="XXXXXX" maxlength="8" required>
    <label class="guarantee-opt" for="guaranteeOpt">
      <input type="checkbox" id="guaranteeOpt">
      <span>
        <strong data-fr="🛡️ Garantie de paiement (+3 %)" data-en="🛡️ Payment guarantee (+3%)">🛡️ Garantie de paiement (+3 %)</strong>
        <small data-fr="Si un membre ne paie pas, la réserve de solidarité du groupe vous verse sa part 20 jours après l’échéance. 3 % sont prélevés sur votre cagnotte, en plus de la commission. Ce qui reste dans la réserve à la fin vous est rendu. Choix définitif une fois le groupe complet." data-en="If a member doesn’t pay, the group’s solidarity reserve pays you their share 20 days after the due date. 3% is taken from your pot, on top of the fee. Whatever is left in the reserve at the end is returned to you. Final once the group is full.">Si un membre ne paie pas, la réserve de solidarité du groupe vous verse sa part 20 jours après l’échéance. 3 % sont prélevés sur votre cagnotte, en plus de la commission. Ce qui reste dans la réserve à la fin vous est rendu. Choix définitif une fois le groupe complet.</small>
      </span>
    </label>
    <button type="submit" class="btn-submit" data-fr="Rejoindre" data-en="Join">Rejoindre ✦</button>
  </form>
  <div class="section-title"><span data-fr="Ou scanner un QR Code" data-en="Or scan a QR Code">Ou scanner un QR Code</span></div>
  <div class="qr-section">
    <div class="qr-icon">📷</div>
    <p style="color:var(--text2);font-size:13px;line-height:1.5;margin-bottom:16px;" data-fr="Scanne le QR Code de la tontine pour rejoindre directement" data-en="Scan the tontine QR Code to join directly">Scanne le QR Code de la tontine pour rejoindre directement</p>
    <a href="#" class="btn-camera" onclick="return false;" data-fr="Ouvrir la camera" data-en="Open camera">Ouvrir la camera</a>
  </div>
  <div class="success-msg" id="successMsg">
    <span data-fr="Tu as rejoint la tontine ! Redirection..." data-en="You joined the tontine! Redirecting...">✅ Tu as rejoint la tontine ! Redirection...</span>
  </div>
</div>
<script>
document.getElementById("guaranteeOpt").checked = neoGuaranteeOn();
document.getElementById("joinForm").addEventListener("submit", function(e) {
  e.preventDefault();
  // Une fois l'adhesion reelle branchee : neoSetGuarantee(idDeLaTontine, coche) apres l'ajout du membre.
  neoSetGuaranteeLocal(document.getElementById("guaranteeOpt").checked);
  document.getElementById("successMsg").classList.add("active");
  setTimeout(() => { window.location.href = "./dashboard.html"; }, 2000);
});
</script>

<script>
let currentLang = localStorage.getItem("ns_lang") || "fr";
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem("ns_lang", lang);
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-fr]").forEach(el => {
    const val = el.getAttribute("data-" + lang);
    if (val) el.textContent = val;
  });
  const fFr = document.getElementById("flag-fr");
  const fEn = document.getElementById("flag-en");
  if(fFr) fFr.classList.toggle("active", lang === "fr");
  if(fEn) fEn.classList.toggle("active", lang === "en");
}
setLang(currentLang);
</script>
</body>
</html>
