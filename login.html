<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0912">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/favicon.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>NEO-SUSU — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</head>
<body>
<div class="container" style="max-width:420px">
  <a href="./index.html" class="back-link" data-fr="← Retour" data-en="← Back">← Retour</a>
  <div class="logo-section">
    <img class="logo-emblem" src="./assets/logo-emblem.png" alt="NEOSUSU" width="120" height="100">
    <h1 class="page-title" data-fr="Connexion" data-en="Sign in">Connexion</h1>
    <p class="page-subtitle" data-fr="Heureux de te revoir 👋" data-en="Welcome back 👋">Heureux de te revoir 👋</p>
  </div>

  <div class="msg" id="msg" role="alert"></div>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="ton@email.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password" data-fr="Mot de passe" data-en="Password">Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <div class="forgot"><a href="#" id="forgotLink" data-fr="Mot de passe oublié ?" data-en="Forgot password?">Mot de passe oublié ?</a></div>
    <button type="submit" class="btn btn-primary btn-submit" id="submitBtn" data-fr="Se connecter ✦" data-en="Sign in ✦">Se connecter ✦</button>
  </form>

  <div class="divider-auth"><span data-fr="ou continuer avec" data-en="or continue with">ou continuer avec</span></div>
  <button class="btn btn-google" id="googleBtn" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    <span data-fr="Continuer avec Google" data-en="Continue with Google">Continuer avec Google</span>
  </button>

  <div class="auth-switch"><span data-fr="Pas encore de compte ?" data-en="No account yet?">Pas encore de compte ?</span> <a href="./signup.html" data-fr="Créer un compte" data-en="Create an account">Créer un compte</a></div>
</div>
<script>
NS.boot();
const t = NS.t;
const btn = document.getElementById("submitBtn");

document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  NS.hideMsg("msg");
  const email = document.getElementById("email").value.trim();
  const pw = document.getElementById("password").value;
  if (!email || !pw) return NS.showMsg("msg", t("Remplissez tous les champs", "Please fill in all fields"));
  NS.setLoading(btn, true, t("Connexion…", "Signing in…"));
  try {
    await NS.signIn(email, pw);
    NS.exitDemo();
    NS.showMsg("msg", t("Connexion réussie !", "Signed in!"), true);
    location.replace("./dashboard.html");
  } catch (err) {
    NS.showMsg("msg", NS.errText(err));
    NS.setLoading(btn, false);
  }
});

document.getElementById("googleBtn").addEventListener("click", async () => {
  try { NS.exitDemo(); await NS.signInWithGoogle(); } catch (err) { NS.showMsg("msg", NS.errText(err)); }
});

document.getElementById("forgotLink").addEventListener("click", async e => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  if (!email) return NS.showMsg("msg", t("Entrez d'abord votre email ci-dessus", "Enter your email above first"));
  try {
    await NS.resetPassword(email);
    NS.showMsg("msg", t("Si un compte existe pour " + email + ", un lien de réinitialisation vient d'être envoyé.", "If an account exists for " + email + ", a reset link has been sent."), true);
  } catch (err) { NS.showMsg("msg", NS.errText(err)); }
});

NS.getUser().then(u => { if (u) { NS.exitDemo(); location.replace("./dashboard.html"); } }).catch(() => {});
</script>
</body>
</html>
