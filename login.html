<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E0C1A">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>NEO-SUSU — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">
<style>
.container{max-width:420px;}.logo-section{text-align:center;margin-bottom:30px;}
.forgot{text-align:right;margin-top:-8px;margin-bottom:16px;}.forgot a{color:var(--sky);font-size:12px;text-decoration:none;font-weight:500;}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:white;color:#1F2937;border:none;border-radius:18px;font-family:var(--ff-b);font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;transition:all .2s;}
.btn-google:hover{background:#f0f0f0;transform:translateY(-1px);}
.divider-auth{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700;}
.divider-auth::before,.divider-auth::after{content:"";flex:1;height:1px;background:var(--stroke);}
.error-msg{background:rgba(212,82,74,.1);border:1px solid rgba(212,82,74,.3);color:#D4524A;padding:12px 16px;border-radius:14px;font-size:13px;margin-top:12px;display:none;}
.error-msg.show{display:block;}
.ok-msg{background:rgba(43,173,122,.1);border:1px solid rgba(43,173,122,.3);color:#2BAD7A;padding:12px 16px;border-radius:14px;font-size:13px;margin-top:12px;display:none;}
.ok-msg.show{display:block;}
.loading{opacity:.7;pointer-events:none;}
</style>
</head>
<body>
<div class="lang-bar">
  <span class="lang-flag active" id="flag-fr" onclick="setLang('fr')">🇫🇷</span>
  <div class="lang-sep"></div>
  <span class="lang-flag" id="flag-en" onclick="setLang('en')">🇬🇧</span>
</div>
<div class="container">
  <a href="./index.html" class="back-link" data-fr="← Retour" data-en="← Back">← Retour</a>
  <div class="logo-section">
    <div class="logo-icon">N</div>
    <h1 class="page-title" data-fr="Connexion" data-en="Sign In">Connexion</h1>
    <p class="page-subtitle" data-fr="Heureux de te revoir" data-en="Welcome back">Heureux de te revoir 👋</p>
  </div>
  <div class="error-msg" id="errMsg"></div>
  <div class="ok-msg" id="okMsg"></div>
  <form id="loginForm">
    <div class="form-group"><label data-fr="Email" data-en="Email">Email</label><input type="email" id="email" placeholder="ton@email.com" required autocomplete="email"></div>
    <div class="form-group"><label data-fr="Mot de passe" data-en="Password">Mot de passe</label><input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"></div>
    <div class="forgot"><a href="#" id="forgotLink" data-fr="Mot de passe oublie ?" data-en="Forgot password?">Mot de passe oublie ?</a></div>
    <button type="submit" class="btn-submit" id="submitBtn">Se connecter ✦</button>
  </form>
  <div class="divider-auth"><span data-fr="ou continuer avec" data-en="or continue with">ou continuer avec</span></div>
  <button class="btn-google" id="googleBtn">
    <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    <span data-fr="Continuer avec Google" data-en="Continue with Google">Continuer avec Google</span>
  </button>
  <div class="signup-link"><span data-fr="Pas encore de compte ?" data-en="No account yet?">Pas encore de compte ?</span> <a href="./signup.html" data-fr="Creer un compte" data-en="Create account">Creer un compte</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="./supabase.js"></script>
<script>
let currentLang=localStorage.getItem("ns_lang")||"fr";
function setLang(lang){currentLang=lang;localStorage.setItem("ns_lang",lang);document.getElementById("html-root").lang=lang;document.querySelectorAll("[data-fr]").forEach(el=>{const v=el.getAttribute("data-"+lang);if(v)el.textContent=v;});document.getElementById("flag-fr").classList.toggle("active",lang==="fr");document.getElementById("flag-en").classList.toggle("active",lang==="en");}
setLang(currentLang);

function showErr(m){const e=document.getElementById("errMsg");e.textContent="⚠️ "+m;e.classList.add("show");document.getElementById("okMsg").classList.remove("show");}
function showOk(m){const e=document.getElementById("okMsg");e.textContent="✅ "+m;e.classList.add("show");document.getElementById("errMsg").classList.remove("show");}
function setLoad(v){const b=document.getElementById("submitBtn");b.classList.toggle("loading",v);b.textContent=v?(currentLang==="en"?"Signing in...":"Connexion en cours..."):(currentLang==="en"?"Sign in ✦":"Se connecter ✦");}

document.getElementById("loginForm").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const email=document.getElementById("email").value.trim();
  const pw=document.getElementById("password").value;
  if(!email||!pw){showErr(currentLang==="en"?"Fill in all fields":"Remplissez tous les champs");return;}
  setLoad(true);
  try{
    await signIn(email,pw);
    showOk(currentLang==="en"?"Redirecting...":"Connexion reussie !");
    setTimeout(()=>{window.location.href="./dashboard.html";},900);
  }catch(err){
    const m={"Invalid login credentials":currentLang==="en"?"Wrong email or password":"Email ou mot de passe incorrect","Email not confirmed":currentLang==="en"?"Please confirm your email":"Confirmez votre email","Too many requests":currentLang==="en"?"Too many attempts":"Trop de tentatives"};
    showErr(m[err.message]||err.message);setLoad(false);
  }
});

document.getElementById("googleBtn").addEventListener("click",async()=>{
  try{await signInWithGoogle();}catch(err){showErr(err.message);}
});

document.getElementById("forgotLink").addEventListener("click",async(e)=>{
  e.preventDefault();
  const email=document.getElementById("email").value.trim();
  if(!email){showErr(currentLang==="en"?"Enter your email first":"Entrez votre email d'abord");return;}
  try{await resetPassword(email);showOk(currentLang==="en"?"Reset link sent to "+email:"Lien envoye a "+email);}catch(err){showErr(err.message);}
});

(async()=>{const u=await getCurrentUser();if(u)window.location.href="./dashboard.html";})();
</script>
</body>
</html>
