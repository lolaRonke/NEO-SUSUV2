<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0912">
<meta name="description" content="NEO-SUSU — l'épargne communautaire (tontine) digitale pour la diaspora africaine.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>NEO-SUSU — L'épargne communautaire intelligente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
<style>
body { padding: 0; }
.splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 80px 24px 28px; position: relative; overflow: hidden; }
.splash::before { content: ""; position: absolute; top: 38%; left: 50%; transform: translate(-50%,-50%); width: 460px; height: 460px; background: radial-gradient(circle, rgba(139,92,246,.28) 0%, rgba(212,175,55,.10) 40%, transparent 70%); filter: blur(50px); pointer-events: none; }
.hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 1; padding: 20px 0; }
.splash-logo { width: 108px; height: 108px; border-radius: 28px; background: linear-gradient(135deg, var(--gold-pale), var(--gold) 55%, var(--gold2)); display: flex; align-items: center; justify-content: center; font-family: var(--ff-s); font-size: 64px; font-weight: 700; color: var(--void); margin-bottom: 26px; box-shadow: 0 16px 48px rgba(212,175,55,.30), 0 0 80px rgba(139,92,246,.30); animation: pop .6s cubic-bezier(.34,1.56,.64,1) both, glow 4s ease-in-out 1s infinite; }
@keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
@keyframes glow { 50% { box-shadow: 0 16px 60px rgba(212,175,55,.45), 0 0 100px rgba(139,92,246,.45); } }
.splash-name { font-family: var(--ff-s); font-size: 48px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, var(--gold-pale), var(--gold)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; animation: up .8s .2s both; }
.splash-sub { font-size: 15px; color: var(--text2); margin-bottom: 22px; animation: up .8s .35s both; }
.features { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 380px; margin-bottom: 20px; animation: up .8s .5s both; }
.flags { display: flex; gap: 14px; font-size: 26px; animation: up .8s .65s both; }
@keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.cta { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 400px; z-index: 1; }
.btn-demo { background: transparent; color: var(--em-pale); border: 1.5px solid rgba(16,185,129,.45); display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-demo:hover { background: rgba(16,185,129,.08); transform: translateY(-2px); }
.legal { margin-top: 26px; text-align: center; font-size: 11px; color: var(--text3); line-height: 1.7; z-index: 1; }
.legal a { color: var(--text2); text-decoration: none; }
</style>
</head>
<body>
<div class="splash">
  <div class="hero">
    <div class="splash-logo">N</div>
    <h1 class="splash-name">NEO-SUSU</h1>
    <p class="splash-sub" data-fr="L'épargne communautaire intelligente 🌍" data-en="Intelligent community savings 🌍">L'épargne communautaire intelligente 🌍</p>
    <div class="features">
      <span class="chip chip-gold" data-fr="Tontines digitales" data-en="Digital tontines">Tontines digitales</span>
      <span class="chip chip-violet" data-fr="Tours automatiques" data-en="Automatic rounds">Tours automatiques</span>
      <span class="chip chip-green" data-fr="Suivi des paiements" data-en="Payment tracking">Suivi des paiements</span>
    </div>
    <div class="flags" aria-hidden="true"><span>🇫🇷</span><span>🇸🇳</span><span>🇳🇬</span><span>🇨🇮</span><span>🇨🇩</span><span>🇬🇧</span></div>
  </div>

  <div class="cta">
    <a href="./signup.html" class="btn btn-primary" data-fr="Commencer — c'est gratuit ✦" data-en="Get started — it's free ✦">Commencer — c'est gratuit ✦</a>
    <a href="./login.html" class="btn btn-secondary" data-fr="Déjà membre ? Se connecter" data-en="Already a member? Sign in">Déjà membre ? Se connecter</a>
    <div class="divider-auth"><span data-fr="ou" data-en="or">ou</span></div>
    <a href="./dashboard.html?mode=demo" class="btn btn-demo" id="demoBtn">👁️ <span data-fr="Découvrir sans compte" data-en="Explore without an account">Découvrir sans compte</span> <span class="chip chip-green">DEMO</span></a>
  </div>

  <footer class="legal">
    © <span id="year"></span> NEO-SUSU · SIREN <span id="siren"></span><br>
    <a href="mailto:contact@neo-susu.com">contact@neo-susu.com</a>
  </footer>
</div>
<script>
NS.boot();
document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("siren").textContent = NS.CFG.COMPANY.siren;
document.getElementById("demoBtn").addEventListener("click", () => { try { sessionStorage.setItem("ns_demo", "1"); } catch (e) {} });
// Utilisateur déjà connecté → directement vers son espace
NS.getUser().then(u => { if (u && !NS.isDemo()) location.replace("./dashboard.html"); }).catch(() => {});
</script>
</body>
</html>
