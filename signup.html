<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0912">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>NEO-SUSU — Créer mon compte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</head>
<body>
<div class="container" style="max-width:460px">
  <a href="./index.html" class="back-link" data-fr="← Retour" data-en="← Back">← Retour</a>
  <div class="logo-section">
    <div class="logo-icon">N</div>
    <h1 class="page-title" data-fr="Créer mon compte" data-en="Create my account">Créer mon compte</h1>
    <p class="page-subtitle" data-fr="Rejoins NEO-SUSU en 1 minute" data-en="Join NEO-SUSU in 1 minute">Rejoins NEO-SUSU en 1 minute</p>
  </div>

  <div class="msg" id="msg" role="alert"></div>

  <form id="signupForm" novalidate>
    <div class="row">
      <div class="form-group"><label for="firstName" data-fr="Prénom" data-en="First name">Prénom</label><input type="text" id="firstName" placeholder="Aïcha" required autocomplete="given-name" maxlength="50"></div>
      <div class="form-group"><label for="lastName" data-fr="Nom" data-en="Last name">Nom</label><input type="text" id="lastName" placeholder="Diallo" required autocomplete="family-name" maxlength="50"></div>
    </div>
    <div class="form-group">
      <label for="country" data-fr="Pays" data-en="Country">Pays</label>
      <select id="country" required>
        <option value="" data-fr="Sélectionner" data-en="Select">Sélectionner</option>
        <option value="FR">🇫🇷 France</option>
        <option value="BE">🇧🇪 Belgique</option>
        <option value="GB">🇬🇧 United Kingdom</option>
        <option value="SN">🇸🇳 Sénégal</option>
        <option value="CI">🇨🇮 Côte d'Ivoire</option>
        <option value="NG">🇳🇬 Nigeria</option>
        <option value="GH">🇬🇭 Ghana</option>
        <option value="CM">🇨🇲 Cameroun</option>
        <option value="CD">🇨🇩 RD Congo</option>
        <option value="ML">🇲🇱 Mali</option>
        <option value="BJ">🇧🇯 Bénin</option>
        <option value="TG">🇹🇬 Togo</option>
        <option value="OTHER" data-fr="Autre" data-en="Other">Autre</option>
      </select>
    </div>
    <div class="form-group"><label for="phone" data-fr="Téléphone" data-en="Phone">Téléphone</label><input type="tel" id="phone" placeholder="+33 6 12 34 56 78" required autocomplete="tel" maxlength="25"></div>
    <div class="form-group"><label for="email">Email</label><input type="email" id="email" placeholder="ton@email.com" required autocomplete="email"></div>
    <div class="form-group">
      <label for="password" data-fr="Mot de passe (8 caractères min.)" data-en="Password (8 characters min.)">Mot de passe (8 caractères min.)</label>
      <input type="password" id="password" placeholder="••••••••" minlength="8" required autocomplete="new-password">
      <div class="pwd-strength"><div class="pwd-bar" id="pwdBar"></div></div>
    </div>
    <button type="submit" class="btn btn-primary btn-submit" id="submitBtn" data-fr="Créer mon compte ✦" data-en="Create my account ✦">Créer mon compte ✦</button>
  </form>

  <div class="divider-auth"><span data-fr="ou s'inscrire avec" data-en="or sign up with">ou s'inscrire avec</span></div>
  <button class="btn btn-google" id="googleBtn" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    <span data-fr="Continuer avec Google" data-en="Continue with Google">Continuer avec Google</span>
  </button>

  <div class="auth-switch"><span data-fr="Déjà un compte ?" data-en="Already have an account?">Déjà un compte ?</span> <a href="./login.html" data-fr="Se connecter" data-en="Sign in">Se connecter</a></div>
</div>
<script>
NS.boot();
const t = NS.t;
const btn = document.getElementById("submitBtn");

document.getElementById("password").addEventListener("input", e => {
  const v = e.target.value;
  let s = 0;
  if (v.length >= 8) s++;
  if (v.length >= 12) s++;
  if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++;
  if (/\d/.test(v) && /[^A-Za-z0-9]/.test(v)) s++;
  const bar = document.getElementById("pwdBar");
  bar.style.width = (v ? Math.max(15, s * 25) : 0) + "%";
  bar.style.background = ["#EF5B5B", "#EF5B5B", "#D4AF37", "#8B5CF6", "#10B981"][s];
});

document.getElementById("signupForm").addEventListener("submit", async e => {
  e.preventDefault();
  NS.hideMsg("msg");
  const v = id => document.getElementById(id).value.trim();
  const meta = { first_name: v("firstName"), last_name: v("lastName"), country: v("country"), phone: v("phone") };
  const email = v("email"), pw = document.getElementById("password").value;
  if (!meta.first_name || !meta.last_name || !meta.country || !meta.phone || !email || !pw)
    return NS.showMsg("msg", t("Remplissez tous les champs", "Please fill in all fields"));
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return NS.showMsg("msg", t("Adresse email invalide", "Invalid email address"));
  if (!/^\+?[0-9 ().-]{6,25}$/.test(meta.phone)) return NS.showMsg("msg", t("Numéro de téléphone invalide", "Invalid phone number"));
  if (pw.length < 8) return NS.showMsg("msg", t("Mot de passe trop court (8 caractères minimum)", "Password too short (8 characters minimum)"));

  NS.setLoading(btn, true, t("Création…", "Creating…"));
  try {
    const res = await NS.signUp(email, pw, meta);
    NS.exitDemo();
    if (res.session) {
      location.replace("./dashboard.html");
    } else {
      document.getElementById("signupForm").classList.add("hidden");
      NS.showMsg("msg", t("Compte créé ! Un email de confirmation a été envoyé à " + email + ". Cliquez sur le lien pour activer votre compte.",
                          "Account created! A confirmation email was sent to " + email + ". Click the link to activate your account."), true);
    }
  } catch (err) {
    NS.showMsg("msg", NS.errText(err));
  }
  NS.setLoading(btn, false);
});

document.getElementById("googleBtn").addEventListener("click", async () => {
  try { NS.exitDemo(); await NS.signInWithGoogle(); } catch (err) { NS.showMsg("msg", NS.errText(err)); }
});

NS.getUser().then(u => { if (u) location.replace("./dashboard.html"); }).catch(() => {});
</script>
</body>
</html>
