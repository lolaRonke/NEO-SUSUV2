<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0912">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/favicon.png">
<title>NEO-SUSU — Détail de la tontine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
<style>
.t-title { font-family: var(--ff-s); font-size: 30px; font-weight: 700; line-height: 1.1; background: linear-gradient(135deg, var(--gold-pale), var(--gold)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
.t-meta { color: var(--text2); font-size: 13px; margin-bottom: 14px; }
.t-desc { color: var(--text2); font-size: 13px; margin-bottom: 14px; font-style: italic; }
.key-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; z-index: 1; }
.key-stat { background: rgba(11,9,18,.55); padding: 12px 14px; border-radius: 14px; }
.ks-label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: .8px; font-weight: 700; }
.ks-value { font-family: var(--ff-s); font-size: 18px; font-weight: 700; white-space: nowrap; }
.turn { font-family: var(--ff-s); font-size: 18px; font-weight: 700; color: var(--text3); width: 26px; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <a href="./dashboard.html" class="back-link" data-fr="← Retour au tableau de bord" data-en="← Back to dashboard">← Retour au tableau de bord</a>
  <div id="root"><div class="skel" style="height:220px;margin-bottom:16px"></div><div class="skel" style="height:60px;margin-bottom:8px"></div><div class="skel" style="height:60px"></div></div>
</div>

<!-- Confirmation de paiement -->
<div class="modal-bg" id="payModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" data-fr="Confirmer ma cotisation" data-en="Confirm my contribution">Confirmer ma cotisation</div>
    <div class="modal-sub" id="paySub"></div>
    <div class="info-box gold" data-fr="Le paiement en ligne (carte, Mobile Money) n'est pas encore activé : ce bouton enregistre que tu as payé ta part à l'organisateur·rice, pour que tout le groupe suive les versements." data-en="Online payment (card, Mobile Money) is not live yet: this records that you paid your share to the organiser, so the whole group can track payments.">Le paiement en ligne (carte, Mobile Money) n'est pas encore activé : ce bouton enregistre que tu as payé ta part à l'organisateur·rice, pour que tout le groupe suive les versements.</div>
    <div class="actions" style="margin-top:8px">
      <button class="btn btn-ghost" id="payCancel" type="button" data-fr="Annuler" data-en="Cancel">Annuler</button>
      <button class="btn btn-emerald" id="payConfirm" type="button" data-fr="Confirmer ✦" data-en="Confirm ✦">Confirmer ✦</button>
    </div>
  </div>
</div>

<script>
NS.boot({ demoBanner: true });
const t = NS.t, esc = NS.esc;
const demo = NS.isDemo();
const params = new URLSearchParams(location.search);
const id = params.get("id");
let d = null;

function inviteLink() { return NS.BASE + "join-tontine.html?code=" + encodeURIComponent(d.invite_code); }

function render() {
  if (!d) return;
  const root = document.getElementById("root");
  const me = d.members.find(m => m.is_me) || {};
  const n = d.members.length;
  const myFee = NS.fee(d.amount, d.my_plan);
  const beneficiary = d.members.find(m => m.turn_order === d.current_round);
  const started = new Date(d.start_date + "T00:00:00").toLocaleDateString(NS.lang === "en" ? "en-GB" : "fr-FR", { day: "numeric", month: "long", year: "numeric" });

  let html = '<div class="hero-card">' +
    '<div class="tc-head" style="position:relative;z-index:1"><div class="t-title">' + esc(d.name) + "</div>" + NS.statusChip(d.status) + "</div>" +
    '<div class="t-meta">' + esc(NS.freqLabel(d.frequency) + " · " + t("1er tour le ", "First round ") + started) + "</div>" +
    (d.description ? '<div class="t-desc">' + esc(d.description) + "</div>" : "") +
    '<div class="key-stats">' +
      '<div class="key-stat"><div class="ks-label">' + esc(t("Cotisation", "Contribution")) + '</div><div class="ks-value">' + esc(NS.money(d.amount, d.currency)) + "</div></div>" +
      '<div class="key-stat"><div class="ks-label">' + esc(t("Pot par tour", "Pot per round")) + '</div><div class="ks-value" style="color:var(--em-pale)">' + esc(NS.money(d.amount * (d.status === "waiting" ? d.max_members : n), d.currency)) + "</div></div>" +
      '<div class="key-stat"><div class="ks-label">' + esc(t("Membres", "Members")) + '</div><div class="ks-value">' + n + " / " + d.max_members + "</div></div>" +
      '<div class="key-stat"><div class="ks-label">' + esc(t("Tour actuel", "Current round")) + '</div><div class="ks-value">' + (d.status === "waiting" ? "—" : Math.min(d.current_round, n) + " / " + n) + "</div></div>" +
    "</div></div>";

  // Bloc d'action principal selon l'état
  if (d.status === "waiting") {
    html += '<div class="card" style="margin-bottom:16px">' +
      '<div class="fee-title">' + esc(t("Invite tes proches", "Invite your people")) + "</div>" +
      '<div class="code-display">' + esc(d.invite_code) + "</div>" +
      '<div class="actions" style="margin-top:10px"><button class="btn btn-secondary" id="copyCode" type="button">' + esc(t("Copier le code", "Copy code")) + '</button><button class="btn btn-primary" id="shareBtn" type="button">' + esc(t("📤 Partager le lien", "📤 Share link")) + "</button></div>" +
      (d.is_owner ? '<p class="hint" style="margin-top:12px">' + esc(t("La tontine démarre automatiquement quand elle est complète. Tu peux aussi la lancer maintenant avec les membres déjà inscrits (2 minimum).", "The tontine starts automatically when full. You can also start it now with the current members (2 minimum).")) + '</p><button class="btn btn-emerald" id="startBtn" type="button" style="margin-top:10px"' + (n < 2 ? " disabled" : "") + ">" + esc(t("▶ Démarrer avec " + n + " membres", "▶ Start with " + n + " members")) + "</button>" : "") +
      "</div>";
  } else if (d.status === "active") {
    html += '<div class="fee-box"><div class="fee-title">' + esc(t("Tour " + d.current_round + " — bénéficiaire : ", "Round " + d.current_round + " — beneficiary: ") + (beneficiary ? beneficiary.first_name + " " + beneficiary.last_name : "—")) + "</div>" +
      '<div class="fee-row"><span>' + esc(t("Ma cotisation", "My contribution")) + '</span><span class="fee-val">' + esc(NS.money(d.amount, d.currency)) + "</span></div>" +
      '<div class="fee-row"><span>' + esc(t("Commission NEO-SUSU (plan ", "NEO-SUSU fee (") + NS.PLANS[d.my_plan].name + " " + String(NS.PLANS[d.my_plan].fee).replace(".", NS.lang === "en" ? "." : ",") + " %)") + '</span><span class="fee-val" style="color:var(--violet-pale)">' + esc(NS.money(myFee, d.currency)) + "</span></div>" +
      '<div class="fee-row"><span>' + esc(t("Total à payer", "Total to pay")) + '</span><span class="fee-val" style="color:var(--gold)">' + esc(NS.money(d.amount + myFee, d.currency)) + "</span></div></div>" +
      (me.paid
        ? '<div class="msg msg-ok show">✓ ' + esc(t("Tu as payé ta part pour ce tour. Merci !", "You paid your share for this round. Thank you!")) + "</div>"
        : '<button class="btn btn-primary" id="payBtn" type="button">' + esc(t("💳 J'ai payé ma part", "💳 I paid my share")) + "</button>");
  } else {
    html += '<div class="msg msg-ok show">🎉 ' + esc(t("Cycle terminé : chaque membre a reçu le pot. Bravo à tout le groupe !", "Cycle complete: every member received the pot. Well done everyone!")) + "</div>";
  }

  // Membres
  const paidCount = d.members.filter(m => m.paid).length;
  html += '<div class="section-title"><span>' + esc(t("Membres et ordre de passage", "Members and turn order")) + "</span>" +
    (d.status === "active" ? '<span class="chip chip-green">' + paidCount + "/" + n + " " + esc(t("payé", "paid")) + "</span>" : "") + "</div>";
  html += d.members.map(m => {
    let chip;
    if (m.received) chip = '<span class="chip chip-violet">' + esc(t("A reçu", "Received")) + "</span>";
    else if (d.status !== "active") chip = "";
    else if (m.paid) chip = '<span class="chip chip-green">' + esc(t("Payé", "Paid")) + "</span>";
    else chip = '<span class="chip chip-gold">' + esc(t("En attente", "Pending")) + "</span>";
    const detail = m.turn_order === d.current_round && d.status === "active"
      ? t("Reçoit le pot ce tour-ci", "Receives the pot this round")
      : t("Reçoit au tour " + m.turn_order, "Receives in round " + m.turn_order);
    return '<div class="member-card' + (m.is_me ? " me" : "") + '"><div class="turn">' + m.turn_order + '</div><div class="avatar' + (m.is_me ? " gold" : "") + '">' + esc((m.first_name || "?")[0].toUpperCase()) + "</div>" +
      '<div class="member-info"><div class="member-name">' + esc(m.first_name + " " + m.last_name) + (m.is_me ? " (" + esc(t("toi", "you")) + ")" : "") + '</div><div class="member-detail">' + esc(detail) + "</div></div>" + chip + "</div>";
  }).join("");

  if (d.status === "active") {
    html += '<div class="actions"><button class="btn btn-secondary" id="shareBtn" type="button">' + esc(t("📤 Partager", "📤 Share")) + '</button><button class="btn btn-ghost" id="copyCode" type="button">' + esc(t("Code : ", "Code: ") + d.invite_code) + "</button></div>";
  }
  root.innerHTML = html;
  document.title = "NEO-SUSU — " + d.name;
  bind();
}

function bind() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); };
  on("copyCode", async () => {
    try { await navigator.clipboard.writeText(d.invite_code); NS.toast(t("Code copié ✓", "Code copied ✓"), "ok"); }
    catch (e) { NS.toast(d.invite_code); }
  });
  on("shareBtn", async () => {
    const text = t("Rejoins ma tontine « " + d.name + " » sur NEO-SUSU avec le code " + d.invite_code + " :", "Join my tontine \"" + d.name + "\" on NEO-SUSU with code " + d.invite_code + ":");
    if (navigator.share) { try { await navigator.share({ title: "NEO-SUSU", text, url: inviteLink() }); } catch (e) {} }
    else { try { await navigator.clipboard.writeText(text + " " + inviteLink()); NS.toast(t("Lien d'invitation copié ✓", "Invitation link copied ✓"), "ok"); } catch (e) { NS.toast(inviteLink()); } }
  });
  on("payBtn", () => {
    document.getElementById("paySub").textContent = t("Total : ", "Total: ") + NS.money(d.amount + NS.fee(d.amount, d.my_plan), d.currency) + t(" (dont commission ", " (incl. fee ") + NS.money(NS.fee(d.amount, d.my_plan), d.currency) + ")";
    document.getElementById("payModal").classList.add("open");
  });
  on("startBtn", async () => {
    if (!confirm(t("Démarrer la tontine maintenant ? Plus personne ne pourra la rejoindre.", "Start the tontine now? Nobody else will be able to join."))) return;
    if (demo) return NS.toast(t("Démo : la tontine démarrerait ici", "Demo: the tontine would start here"));
    try { await NS.rpc("start_tontine", { p_tontine: d.id }); NS.toast(t("Tontine démarrée ✦", "Tontine started ✦"), "ok"); await load(); }
    catch (e) { NS.toast(NS.errText(e), "err"); }
  });
}

document.getElementById("payCancel").addEventListener("click", () => document.getElementById("payModal").classList.remove("open"));
document.getElementById("payModal").addEventListener("click", e => { if (e.target.id === "payModal") e.target.classList.remove("open"); });
document.getElementById("payConfirm").addEventListener("click", async () => {
  const btn = document.getElementById("payConfirm");
  if (demo) {
    document.getElementById("payModal").classList.remove("open");
    const me = d.members.find(m => m.is_me); if (me) me.paid = true;
    render();
    return NS.toast(t("Paiement enregistré (démo) ✓", "Payment recorded (demo) ✓"), "ok");
  }
  NS.setLoading(btn, true, "…");
  try {
    const r = await NS.rpc("pay_contribution", { p_tontine: d.id });
    document.getElementById("payModal").classList.remove("open");
    NS.toast(r && r.payout ? t("Paiement enregistré ✓ — tout le monde a payé, le pot est versé !", "Payment recorded ✓ — everyone paid, the pot is paid out!") : t("Paiement enregistré ✓", "Payment recorded ✓"), "ok");
    await load();
  } catch (e) { NS.toast(NS.errText(e), "err"); }
  NS.setLoading(btn, false);
});
document.addEventListener("langchange", render);

async function load() {
  if (!id) { location.replace("./dashboard.html"); return; }
  if (demo) { d = NS.DEMO.detail(id); return render(); }
  try {
    await NS.requireAuth();
    d = await NS.rpc("tontine_detail", { p_tontine: id });
    d.amount = Number(d.amount);
    render();
    if (params.get("new") === "1") { NS.toast(t("Tontine créée ✦ Partage le code avec tes membres", "Tontine created ✦ Share the code with your members"), "ok"); history.replaceState(null, "", "?id=" + encodeURIComponent(id)); }
  } catch (err) {
    if (err.message === "redirect") return;
    document.getElementById("root").innerHTML = '<div class="empty">⚠️ ' + esc(NS.errText(err)) + "</div>";
  }
}
load();
</script>
</body>
</html>
