<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0912">
<meta name="robots" content="noindex">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<title>NEO-SUSU — Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
<style>
.stat-card { text-align: left; padding: 18px; }
.stat-value { font-size: 30px; }
.vol { font-size: 13px; color: var(--em-pale); font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--text3); padding: 8px 6px; border-bottom: 1px solid var(--stroke2); }
td { padding: 10px 6px; border-bottom: 1px solid var(--stroke); vertical-align: top; }
.tbl { overflow-x: auto; }
</style>
</head>
<body>
<div class="container wide">
  <a href="./dashboard.html" class="back-link" data-fr="← Retour" data-en="← Back">← Retour</a>
  <h1 class="page-title" data-fr="Espace administrateur" data-en="Admin space">Espace administrateur</h1>
  <p class="page-subtitle" data-fr="Vue d'ensemble de la plateforme" data-en="Platform overview">Vue d'ensemble de la plateforme</p>
  <div id="root"><div class="skel" style="height:200px"></div></div>
</div>
<script>
NS.boot();
const t = NS.t, esc = NS.esc;
let s = null;

function render() {
  const root = document.getElementById("root");
  if (!s) return;
  const vol = (s.volume_month || []).map(v => esc(NS.money(v.total, v.currency))).join("<br>") || "—";
  root.innerHTML =
    '<div class="stats-grid two">' +
      '<div class="stat-card"><div class="stat-label">' + esc(t("Utilisateurs", "Users")) + '</div><div class="stat-value">' + s.users + '</div><div class="vol">+' + s.users_month + " " + esc(t("ce mois", "this month")) + "</div></div>" +
      '<div class="stat-card"><div class="stat-label">' + esc(t("Tontines", "Tontines")) + '</div><div class="stat-value">' + s.tontines_total + '</div><div class="vol">' + s.tontines_active + " " + esc(t("actives", "active")) + " · " + s.tontines_waiting + " " + esc(t("en attente", "waiting")) + "</div></div>" +
      '<div class="stat-card"><div class="stat-label">' + esc(t("Cotisations ce mois", "Contributions this month")) + '</div><div class="stat-value">' + s.contributions_month + '</div><div class="vol">' + vol + "</div></div>" +
      '<div class="stat-card"><div class="stat-label">' + esc(t("KYC à traiter", "KYC to review")) + '</div><div class="stat-value">' + s.kyc_pending + "</div></div>" +
    "</div>" +
    '<div class="section-title"><span>' + esc(t("Dernières tontines", "Latest tontines")) + "</span></div>" +
    '<div class="card tbl"><table><thead><tr><th>' + esc(t("Nom", "Name")) + "</th><th>" + esc(t("Organisateur", "Organiser")) + "</th><th>" + esc(t("Membres", "Members")) + "</th><th>" + esc(t("Statut", "Status")) + "</th></tr></thead><tbody>" +
    ((s.recent_tontines || []).map(x => "<tr><td>" + esc(x.name) + '<br><span class="hint">' + esc(NS.money(x.amount, x.currency)) + "</span></td><td>" + esc(x.owner) + "</td><td>" + x.members + "/" + x.max_members + "</td><td>" + NS.statusChip(x.status) + "</td></tr>").join("") || '<tr><td colspan="4" class="hint">' + esc(t("Aucune tontine", "No tontines")) + "</td></tr>") +
    "</tbody></table></div>" +
    '<div class="section-title"><span>' + esc(t("Derniers inscrits", "Latest sign-ups")) + "</span></div>" +
    '<div class="card tbl"><table><thead><tr><th>' + esc(t("Nom", "Name")) + "</th><th>" + esc(t("Pays", "Country")) + "</th><th>Plan</th><th>KYC</th></tr></thead><tbody>" +
    ((s.recent_users || []).map(u => "<tr><td>" + esc(u.name) + "</td><td>" + esc(u.country || "—") + "</td><td>" + esc(u.plan) + "</td><td>" + esc(u.kyc_status) + "</td></tr>").join("") || '<tr><td colspan="4" class="hint">—</td></tr>') +
    "</tbody></table></div>";
}
document.addEventListener("langchange", render);

(async () => {
  const root = document.getElementById("root");
  if (NS.isDemo()) { root.innerHTML = '<div class="empty">' + esc(t("L'espace administrateur n'est pas disponible en mode démo.", "The admin space is not available in demo mode.")) + "</div>"; return; }
  try {
    await NS.requireAuth();
    s = await NS.rpc("admin_stats");
    render();
  } catch (err) {
    if (err.message === "redirect") return;
    root.innerHTML = '<div class="empty">🔒 ' + esc(/FORBIDDEN/.test(err.message) ? t("Accès réservé aux administrateurs.", "Administrators only.") : NS.errText(err)) + "</div>";
  }
})();
</script>
</body>
</html>
